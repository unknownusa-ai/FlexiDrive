git sservices:
  db:
    container_name: flexidrive_db
    image: postgres:16-alpine
    restart: "no"
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flexidrive_network

  pgadmin:
    container_name: flexidrive_pgadmin
    image: dpage/pgadmin4:8
    restart: "no"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@flexidrive.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - flexidrive_network

  backend:
    container_name: flexidrive_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DB_HOST: db
      DB_PORT: 5432
      FLEXIDRIVE_CORS_ALLOWED_ORIGINS: ${FLEXIDRIVE_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
      python manage.py migrate &&
      if [ \"${DJANGO_DEBUG:-True}\" = \"True\" ]; then
        python manage.py runserver 0.0.0.0:8000;
      else
        gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120;
      fi
      "
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()\""]
      interval: 15s
      timeout: 5s
      retries: 8
    networks:
      - flexidrive_network

  frontend:
    container_name: flexidrive_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: "no"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - flexidrive_network

volumes:
  postgres_data:

networks:
  flexidrive_network:
    name: flexidrive_network
    driver: bridge
